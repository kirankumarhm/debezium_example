services:

  # ─── Source Database (CDC Source) ────────────────────────────────────────────
  # PostgreSQL with sample data for CDC pipeline examples
  source-postgres:
    image: postgres:17.6
    container_name: source-postgres
    hostname: source-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    volumes:
      - ./scripts/source-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Platform Database ────────────────────────────────────────────────────────
  # Stores conductor metadata, pipeline configs, offset and schema history tables
  postgres:
    image: postgres:17.6
    container_name: postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Conductor (Backend API) ──────────────────────────────────────────────────
  # Quarkus-based backend that manages pipelines, sources, destinations
  # Exposed only internally - access via nginx proxy on port 8080
  conductor:
    image: quay.io/debezium/platform-conductor:nightly
    container_name: conductor
    hostname: conductor
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres
      QUARKUS_DATASOURCE_USERNAME: user
      QUARKUS_DATASOURCE_PASSWORD: password
      CONDUCTOR_WATCHER_OFFSET_STORAGE_TYPE: org.apache.kafka.connect.storage.FileOffsetBackingStore
      CONDUCTOR_DESCRIPTORS_VOLUME_SOURCE: "false"
      CONDUCTOR_DESCRIPTORS_IMAGE_REGISTRY: quay.io
      CONDUCTOR_DESCRIPTORS_IMAGE_NAME: debezium/debezium-descriptors
      CONDUCTOR_DESCRIPTORS_IMAGE_TAG: nightly
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/api/pipelines"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Nginx CORS Proxy ─────────────────────────────────────────────────────────
  # Sits in front of conductor and injects CORS headers.
  # Required because Quarkus prod image ignores runtime CORS env vars.
  # Stage UI (browser) calls http://localhost:8080 which hits this proxy.
  nginx:
    image: nginx:alpine
    container_name: nginx
    hostname: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      conductor:
        condition: service_healthy
    restart: unless-stopped

  # ─── Stage (Frontend UI) ──────────────────────────────────────────────────────
  # React-based UI — browser calls CONDUCTOR_URL directly, so use localhost:8080
  stage:
    image: quay.io/debezium/platform-stage:nightly
    container_name: stage
    hostname: stage
    ports:
      - "3000:3000"
    environment:
      CONDUCTOR_URL: http://localhost:8080
    depends_on:
      - nginx
    restart: unless-stopped
